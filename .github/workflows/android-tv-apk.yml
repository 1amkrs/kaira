name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'public/flicx-interactive.js'
      - 'scripts/sync-android-assets.mjs'
      - 'scripts/prepare-gh-pages.mjs'
      - '.github/workflows/android-tv-apk.yml'

permissions:
  contents: read

jobs:
  build-android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & sync Kaira assets into Android TV app
        env:
          SKIP_SOURCE_HYDRATION: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build:android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK platform & build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Kotlin unit tests & assemble Android TV APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload Kaira Android TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaira-android-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
