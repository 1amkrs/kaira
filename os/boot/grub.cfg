set default="0"
set timeout=2

# High-DPI TV Font & Resolution
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png

terminal_output gfxterm

menuentry "TV OS (Personal Appliance)" --class tvos --class gnu-linux --class os {
    linux /live/vmlinuz boot=live quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=0 systemd.mask=getty@tty1.service rd.systemd.show_status=0 fastboot
    initrd /live/initrd.img
}

menuentry "TV OS (Recovery Mode / Safe Shell)" --class tvos-recovery --class gnu-linux --class os {
    linux /live/vmlinuz boot=live single systemd.unit=rescue.target loglevel=4
    initrd /live/initrd.img
}
